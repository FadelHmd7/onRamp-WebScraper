[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "onramp-scraper"
version = "0.1.0"
description = "Distributed, fault-tolerant web scraper for onRamp Phase 1"
readme = "README.md"
requires-python = ">=3.12,<3.13"
# Runtime dependencies are added by the task that first needs them.
dependencies = [
    "celery>=5.5",
    "fastapi>=0.115",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "celery-types>=0.23",
    "httpx>=0.28",
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
    "types-pyyaml>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import order
    "UP",       # pyupgrade
    "B",        # bugbear
    "SIM",      # simplify
    "S",        # bandit security checks
    "RUF",      # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is how pytest works

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs live Redis or Postgres (run in CI and compose)",
]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
