<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>onRamp Web Scraper</title>
</head>
<body>
  <h1>onRamp Web Scraper</h1>
  <p>UI placeholder. The React app arrives in task U1.</p>
  <p>API health: <code id="health">checking…</code></p>
  <script>
    fetch("/api/health")
      .then((r) => r.json())
      .then((j) => { document.getElementById("health").textContent = JSON.stringify(j); })
      .catch((e) => { document.getElementById("health").textContent = "unreachable: " + e; });
  </script>
</body>
</html>
